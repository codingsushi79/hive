[package]
name = "hive"
version = "0.1.0"
edition = "2024"
description = "Run, watch and review a fleet of Claude Code agents from one TUI, with a daemon that keeps them working after you close it"
license = "MIT"
repository = "https://github.com/codingsushi79/hive"
readme = "README.md"
keywords = ["agents", "claude", "tui", "code-review", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
toml = "0.9"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
